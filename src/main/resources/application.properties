spring.application.name=sbj-outbox-pattern
server.port=8080

# PostgreSQL (docker compose up -d)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/outbox}
spring.datasource.username=${DB_USER:outbox}
spring.datasource.password=${DB_PASSWORD:outbox}

# El esquema lo define schema.sql (incluye el índice parcial de eventos pendientes)
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# Kafka (docker compose up -d)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.auto-offset-reset=earliest

# Outbox
outbox.topic=orders.events
outbox.batch-size=50
outbox.max-attempts=5
outbox.relay-delay-ms=500
outbox.retention=7d
